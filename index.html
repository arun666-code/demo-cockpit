<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Cockpit Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Hind:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: control bar, walkthrough strip, four actors side by side drawn as their devices, ruled gate register below. Left aligned. */
  --ground:#E7ECF2; --panel:#FFFFFF; --screen:#F6F8FB; --ink:#14213D; --ink-soft:#56617A; --line:#C7D0DC;
  --accent:#1D4ED8; --accent-bg:#E1E9FE; --on-accent:#FFFFFF;
  --signal:#F2B705; --signal-bg:#FFF2BF; --signal-ink:#5C4500;
  --ok:#126C32; --ok-bg:#DDF3E4; --stop:#C0262D; --stop-bg:#FBE1E1;
  --bezel:#1B2333; --rule:#DCE3EC;
  --font-display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --font-body:'Barlow','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-hi:'Hind','Noto Sans Devanagari','Nirmala UI','Mangal',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F141D; --panel:#19202D; --screen:#141A25; --ink:#E8ECF4; --ink-soft:#9BA7BE; --line:#33405A;
    --accent:#86A8FF; --accent-bg:#22305A; --on-accent:#0F141D;
    --signal:#F5C431; --signal-bg:#3D3210; --signal-ink:#F8DC7A;
    --ok:#56C783; --ok-bg:#173524; --stop:#F1766F; --stop-bg:#45201F;
    --bezel:#05080D; --rule:#2A3448; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F141D; --panel:#19202D; --screen:#141A25; --ink:#E8ECF4; --ink-soft:#9BA7BE; --line:#33405A;
  --accent:#86A8FF; --accent-bg:#22305A; --on-accent:#0F141D;
  --signal:#F5C431; --signal-bg:#3D3210; --signal-ink:#F8DC7A;
  --ok:#56C783; --ok-bg:#173524; --stop:#F1766F; --stop-bg:#45201F;
  --bezel:#05080D; --rule:#2A3448; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.4 var(--font-body);-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* control bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:10px 20px;background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1.1;font-weight:400;font-size:inherit}
.brand b{font:700 26px/1 var(--font-display);letter-spacing:.01em}
.brand span{font-size:12px;color:var(--ink-soft)}
.views{display:flex;gap:4px;flex-wrap:wrap}
.views button{border:0;background:none;padding:8px 14px;border-radius:6px;font:600 19px/1 var(--font-display);color:var(--ink-soft);border-bottom:3px solid transparent}
.views button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);border-radius:6px 6px 0 0}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px}
.clock b{color:var(--ink);font:600 20px/1 var(--font-display);margin-left:4px}
.net{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 6px 5px 14px;font-weight:600}
.net i{display:block;width:44px;height:24px;border-radius:999px;background:var(--ok);position:relative;transition:background .2s}
.net i::after{content:"";position:absolute;top:3px;left:23px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.net[aria-checked="false"]{border-color:var(--signal)}
.net[aria-checked="false"] i{background:var(--signal)}
.net[aria-checked="false"] i::after{left:3px}
.band{height:5px;background:var(--accent)}
.band.off{height:auto;padding:6px 20px;background:repeating-linear-gradient(-45deg,var(--signal) 0 18px,#1B2333 18px 36px)}
.band.off span{display:inline-block;background:var(--signal);color:#1B2333;font-weight:600;padding:2px 10px;border-radius:4px}

/* buttons and chips */
.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ok{background:var(--ok);color:var(--on-accent)}
.btn.stop{background:var(--stop);color:var(--on-accent)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.wide{width:100%}
.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:2px}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.stop{background:var(--stop-bg);color:var(--stop)}
.chip.warn{background:var(--signal-bg);color:var(--signal-ink)}
.chip.info{background:var(--accent-bg);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tiny{font-size:13px;color:var(--ink-soft)}
.hint{outline:3px solid var(--signal)!important;outline-offset:3px;box-shadow:0 0 0 7px var(--ink);animation:hint 1s ease-in-out 3}
@keyframes hint{50%{outline-offset:8px}}
@media (prefers-reduced-motion: reduce){.hint{animation:none}*{transition:none!important}.scene .arm,.over.call .ring,.register .tbl tr.fresh td{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* walkthrough */
.guide{display:grid;grid-template-columns:auto 1fr auto;gap:8px 24px;align-items:start;padding:8px 20px;border-bottom:1px solid var(--line)}
.guide.closed{display:block;padding:6px 20px}
.g-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g-nav select{padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);max-width:min(100%,360px);font-weight:600}
.g-shows{font:600 21px/1.2 var(--font-display);text-wrap:balance;max-width:70ch}
.g-steps{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:6px;counter-reset:s}
.g-steps li{counter-increment:s;color:var(--ink-soft);max-width:56ch;padding-left:24px;position:relative}
.g-steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);font-size:11.5px;font-weight:600;display:grid;place-items:center}
.g-steps li.cur{color:var(--ink);font-weight:500}
.g-steps li.cur::before{background:var(--signal);color:#1B2333;box-shadow:none}
.g-steps li.done{text-decoration:line-through;text-decoration-color:var(--line)}
.g-steps li.done::before{content:"✓";background:var(--ok);color:var(--on-accent);box-shadow:none}
.g-qs{margin-top:6px;list-style:decimal;padding-left:20px;color:var(--ink);columns:2 320px;column-gap:32px}
.g-side{display:flex;gap:8px;align-items:center}

/* stage */
.stage{display:grid;gap:16px;padding:16px 20px 8px;align-items:start}
.stage.soc{grid-template-columns:290px minmax(300px,1.15fr) minmax(220px,.8fr) minmax(320px,1.25fr)}
.stage.rst{grid-template-columns:290px minmax(300px,1.1fr) minmax(320px,1.25fr) 290px}
.actor h2{font:600 20px/1.1 var(--font-display)}
.actor .who{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.dev{height:clamp(340px,calc(100vh - 420px),548px);position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--screen)}
.phone{border:10px solid var(--bezel);border-radius:34px;max-width:290px}
.tablet{border:12px solid var(--bezel);border-radius:20px}
.window{border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
.win-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-soft)}
.win-bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.status{display:flex;justify-content:space-between;padding:5px 16px 3px;font-size:12px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.body{flex:1;overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.scr-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.scr-h b{font:600 20px/1.1 var(--font-display)}
.act{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 12px;font-weight:500}
.act::after{content:"›";color:var(--ink-soft);font-size:20px;line-height:1}
.badge{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 7px;font-size:12px;margin-left:6px}
.notes li{padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.notes time{display:block;font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sub{font:600 16px/1.2 var(--font-display);color:var(--ink-soft)}
.req{border:2px solid var(--signal);background:var(--signal-bg);color:var(--signal-ink);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.req .tiny{color:inherit}
.sos{border:0;background:#C0262D;color:#fff;border-radius:999px;padding:10px;font:700 20px/1 var(--font-display);letter-spacing:.06em;width:100%}
.sos-status{width:100%;border:2px solid #C0262D;border-radius:10px;padding:7px 10px;background:var(--stop-bg);color:var(--stop);font-weight:600;font-size:14px}
.foot-row{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--rule);background:var(--screen)}
.foot-row .btn{flex:1 1 auto}
.nw{white-space:nowrap}
.over{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:18px;background:var(--screen)}
.over.call{background:#12301F;color:#fff;text-align:center}
.over.call .ring{width:64px;height:64px;border-radius:50%;background:#2FA862;margin:0 auto;display:grid;place-items:center;animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 14px rgba(47,168,98,.25)}}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keys button{border:0;border-radius:12px;padding:10px;background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.keys .k1{background:#2FA862}
.keys .k2{background:#B5343A}
.keys b{display:block;font:700 30px/1 var(--font-display)}
.over.alarm{background:#C0262D;color:#fff;text-align:center}
.over.alarm b{font:700 34px/1.05 var(--font-display)}
.over.dim{background:color-mix(in srgb,var(--bezel) 55%,transparent);justify-content:center}
.sheet{background:var(--panel);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-soft)}
.field input,.field select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:15px}
.qr{width:150px;height:150px;border-radius:8px;display:block;margin:0 auto}
.code{font:700 30px/1 var(--font-display);letter-spacing:.18em;text-align:center}
.cert{border:1.5px dashed var(--ok);border-radius:10px;padding:10px;font-size:13.5px;background:var(--ok-bg)}
.err{color:var(--stop);font-weight:600;font-size:13.5px}

/* guard tablet */
.guard{font-family:var(--font-body)}
.guard.hi{font-family:var(--font-hi)}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:3px 12px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--screen)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:16px}
.tile svg{width:34px;height:34px;color:var(--accent)}
.card{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:14px;padding:16px}
.result.ok{background:var(--ok-bg);color:var(--ok)}
.result.stop{background:var(--stop-bg);color:var(--stop)}
.result b{font:700 30px/1.1 var(--font-display)}
.guard.hi .result b{font-family:var(--font-hi);font-size:24px}
.finder{height:92px;border-radius:10px;background:#0E1420;position:relative}
.finder::after{content:"";position:absolute;inset:16px 34%;border:2px solid #fff;border-radius:6px;opacity:.8}
.pick{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px}
.pick small{display:block;color:var(--ink-soft)}
.list li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule);font-size:13.5px;font-variant-numeric:tabular-nums}

/* gate */
.gate{border-radius:10px;background:var(--panel);border:1.5px solid var(--line);overflow-y:auto}
.plate-cam{background:#0E1420;color:#D5DBE6;padding:10px 12px;font-size:12.5px}
.plate{display:inline-block;margin-top:6px;background:#fff;color:#111;border:2px solid #111;border-radius:5px;padding:2px 10px;font:700 24px/1.1 var(--font-display);letter-spacing:.08em}
.plate.none{background:none;border-color:#56617A;color:#8C97AD}
.scene{position:relative;height:clamp(118px,calc(100vh - 600px),210px);flex:none;margin:6px 0;overflow:hidden}
.scene .road{position:absolute;left:0;right:0;bottom:0;height:42px;background:#5B6474}
.scene .road::after{content:"";position:absolute;left:0;right:0;top:19px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 44px);opacity:.8}
.scene .booth{position:absolute;left:10px;bottom:42px;width:50px;height:70px;background:var(--accent-bg);border:2px solid var(--ink-soft);border-radius:4px 4px 0 0}
.scene .booth::before{content:"";position:absolute;left:8px;right:8px;top:10px;height:24px;background:var(--panel);border:2px solid var(--ink-soft)}
.scene .post{position:absolute;left:72px;bottom:42px;width:14px;height:58px;background:var(--ink-soft);border-radius:3px}
.scene .arm{position:absolute;left:79px;bottom:92px;height:10px;width:calc(100% - 92px);border-radius:3px;border:1px solid #7a1418;background:repeating-linear-gradient(90deg,#C0262D 0 16px,#fff 16px 32px);transform-origin:0 50%}
.scene.open .arm{animation:armup .8s cubic-bezier(.3,.8,.3,1) both;animation-delay:var(--el,0ms)}
.scene.shut .arm{animation:armdown .8s cubic-bezier(.3,.8,.3,1) both;animation-delay:var(--el,0ms)}
@keyframes armup{from{transform:rotate(0)}to{transform:rotate(-68deg)}}
@keyframes armdown{from{transform:rotate(-68deg)}to{transform:rotate(0)}}
.gate-state{padding:0 12px;font:700 28px/1 var(--font-display)}
.gate-state.open{color:var(--ok)}
.gate-btns{padding:8px 12px 10px;display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.gate-btns .btn{flex:1 1 auto;padding:5px 10px;font-size:14px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border-left:3px solid var(--accent);padding:2px 0 2px 9px}
.kpi b{display:block;font:700 30px/1 var(--font-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--ink-soft)}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 10px;font-weight:600;color:var(--ink-soft);border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;text-align:left;color:var(--ink-soft);font-size:12.5px;padding:5px 8px 5px 0;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:6px 8px 6px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.incident{border:2px solid var(--stop);border-radius:10px;padding:9px 10px;background:var(--stop-bg)}
.incident ol{list-style:decimal;padding-left:18px;font-size:13.5px;margin-top:4px}
.hidden-note{border:1.5px dashed var(--line);border-radius:10px;padding:10px;color:var(--ink-soft);font-size:13.5px}

/* register: the gate's visitor book */
.register{margin:8px 20px 20px;background:var(--panel);border:1.5px solid var(--line);border-left:6px solid var(--accent);border-radius:4px 10px 10px 4px}
.reg-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;padding:10px 14px 6px}
.reg-h h2{font:600 22px/1 var(--font-display)}
.reg-scroll{max-height:250px;overflow:auto;padding:0 14px 8px}
.register .tbl td{border-bottom:1px solid var(--rule);padding-top:7px;padding-bottom:7px}
.register .tbl tr.fresh td{animation:fresh 2.6s ease-out both;animation-delay:var(--age,0ms)}
@keyframes fresh{from{background:var(--accent-bg)}to{background:transparent}}
.t-ok{color:var(--ok);font-weight:600}.t-stop{color:var(--stop);font-weight:600}.t-warn{color:var(--signal-ink);font-weight:600}
.fp{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--ink-soft)}

/* restaurant */
.menu li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule)}
.menu small{display:block;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-weight:700;line-height:1}
.step b{min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.bill td:last-child,.bill th:last-child{text-align:right;padding-right:0}
.bill .void td{text-decoration:line-through;color:var(--ink-soft)}
.totals{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px}
.totals div{display:flex;justify-content:space-between;gap:28px}
.totals .grand{font:700 24px/1.2 var(--font-display);border-top:1.5px solid var(--line);margin-top:4px;padding-top:4px}
.kds{background:#0E1420;color:#E8ECF4}
.kds .cols{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;overflow-y:auto;overflow-x:hidden;align-content:start}
.kds h3{font:600 18px/1 var(--font-display);margin-bottom:8px;color:#9BA7BE}
.tkt{background:#1D2637;border-left:4px solid #F2B705;border-radius:6px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.tkt b{font:600 19px/1.1 var(--font-display)}
.tkt .meta{display:flex;flex-wrap:wrap;gap:0 8px;justify-content:space-between;font-size:12.5px;color:#9BA7BE;font-variant-numeric:tabular-nums}
.tkt.ready{border-left-color:#56C783;opacity:.6}
.tkt.void{border-left-color:#F1766F;opacity:.7}
.tkt.void b{text-decoration:line-through}
.tkt button{border:0;border-radius:6px;background:#56C783;color:#0E1420;font-weight:700;padding:5px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum div{border:1.5px solid var(--line);border-radius:10px;padding:5px 9px;background:var(--panel)}
.sum b{display:block;font:700 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--ink-soft)}
.alert{border-left:4px solid var(--signal);background:var(--signal-bg);color:var(--signal-ink);border-radius:6px;padding:7px 9px;font-size:13.5px}
.alert.stop{border-left-color:var(--stop);background:var(--stop-bg);color:var(--stop)}
.alert time{display:block;font-size:11.5px;opacity:.8}
.empty{color:var(--ink-soft);border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center}

/* shared log */
.audit{margin:16px 20px 20px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:16px}
.audit-h{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.audit-h h2{font:600 26px/1.1 var(--font-display)}
.audit-h p{max-width:65ch;color:var(--ink-soft)}
.audit-scroll{overflow-x:auto}
.foot{padding:0 20px 28px;color:var(--ink-soft);font-size:13px;max-width:90ch}

function seed(){
 log('society','Guard Suresh','Started the evening shift at the main gate.',{t:'14:00:05'});

 var prev='00000000';
 [['13:12',1260],['13:31',882],['13:55',2478],['14:20',630],['14:42',1743]].forEach(function(b,i){
  var no='SR/26-27/'+(1041+i);var h=fnv(prev+no+b[0]+b[1]);S.rst.bills.push({no:no,t:b[0],total:b[1],printed:b[1],hash:h});prev=h;});

 S.rst.lines.push({id:'k2',table:2,name:'Sweet Lassi',qty:2,price:120,st:'Bar',status:'new',since:Date.now()-185000});
}
function log(domain,actor,text,o){
 o=o||{};var e={id:++S.seq,t:o.t||clock(),domain:domain,actor:actor,text:text,tone:o.tone||'',metric:o.metric||'',queued:!!o.queued,synced:false,born:o.t?0:Date.now()};
 e.prev=S.events.length?S.events[S.events.length-1].hash:'00000000';
 e.hash=fnv(e.prev+'|'+e.t+'|'+domain+'|'+actor+'|'+text);S.events.push(e);S.auditOk=null;return e;
}
function gateLog(actor,text,o){o=o||{};o.queued=!S.online;return log('society',actor,text,o);}
function notify(text,x){var n={t:clock().slice(0,5),text:text};if(x&&x.dispute)n.dispute=x.dispute;S.res.notes.unshift(n);}
function gateNotify(text,x){if(S.online)notify(text,x);else S.held.push({text:text,dispute:x&&x.dispute});}
function mark(k){S.done[k]=true;}
function later(ms,fn){var ep=EPOCH;setTimeout(function(){if(ep===EPOCH){fn();render();}},ms);}
function openGate(){if(!S.gate.open)S.gate.changedAt=Date.now();S.gate.open=true;S.gate.closeAt=Date.now()+4500;}
function closeGate(){if(S.gate.open){S.gate.open=false;S.gate.changedAt=Date.now();}}
function addVisit(name,flat,purpose){var p=!S.online;S.visits.unshift({id:'n'+(++S.seq),name:name,flat:flat,purpose:purpose,t:'Today '+clock().slice(0,5),pending:p});if(!p)S.dash.entries++;}
function cloudVisits(){return S.visits.filter(function(v){return !v.pending;});}
function speed(a,b){return (a+Math.random()*(b-a)).toFixed(1);}
function ownerAlert(text,tone){S.rst.alerts.unshift({t:clock().slice(0,5),text:text,tone:tone||''});}
function billLines(){return S.rst.lines.filter(function(l){return l.table===4&&!l.closed;});}
function billMath(){var sub=0,base=0,B=S.rst.bill;billLines().forEach(function(l){if(l.status!=='void'){sub+=l.qty*l.price;if(l.disc)base+=l.qty*l.price;}});
 var disc=B.discount?Math.round(base*B.discount/100):0,gst=Math.round((sub-disc)*0.05),total=sub-disc+gst;return {sub:sub,disc:disc,gst:gst,total:total,due:total-B.paid};}
function req(id){return S.reqs.filter(function(r){return r.id===id;})[0];}
function line(id){return S.rst.lines.filter(function(l){return l.id===id;})[0];}
function ringing(){var c=S.reqs.filter(function(r){return r.flat==='B-304'&&r.status==='calling';});return c[c.length-1];}
function sosOpen(){return S.sos&&!S.sos.closed;}
function finishReq(r,ok,how,viaIntercom){
 r.status=ok?'approved':'denied';r.how=how;
 if(ok){openGate();addVisit(r.who,r.flat,r.kind==='delivery'?'Delivery':'Visitor');
  gateLog('Gate',r.who+' for flat '+r.flat+' let in. '+how+'. Gate opened.',{tone:'ok'});}
 else gateLog('Gate',r.who+' for flat '+r.flat+' turned away. '+how+'. Gate stays closed.',{tone:'stop'});
 if(r.flat==='B-304')gateNotify(r.who+(ok?' was let in. ':' was turned away. ')+how+'.',viaIntercom&&ok?{dispute:r.id}:null);
}
function payBill(how,who){
 var m=billMath(),B=S.rst.bill;if(m.due<=0)return;B.paid+=m.due;B.how.push(how);
 log('restaurant',who,(who==='Guest at table 4'?'Paid ':'Took ')+rupee(m.due)+' by '+how+' for table 4'+(how==='UPI'&&who==='Guest at table 4'?' (simulated)':'')+'.',{tone:'ok',metric:how==='cash'?'':'confirmed in '+speed(2.5,3.5)+' s'});
}

var A={
 view:function(v){S.view=v;if(v==='audit')mark('audit_opened');},
 'toggle-net':function(){
  S.online=!S.online;S.syncId++;
  if(!S.online){log('society','Gate','Gate internet went off. The tablet and the barrier now work from what is saved on the device.',{tone:'warn'});mark('offline');
   S.reqs.forEach(function(r){if(r.status==='pending'||r.status==='calling'){r.status='intercom';}});}
  else{
   var id=S.syncId,q=S.events.filter(function(e){return e.queued&&!e.synced;});
   q.forEach(function(e,i){later(220*(i+1),function(){if(S.syncId===id)e.synced=true;});});
   later(220*q.length+450,function(){
    if(S.syncId!==id)return;
    S.visits.forEach(function(v){if(v.pending){v.pending=false;S.dash.entries++;}});
    S.held.forEach(function(h){notify(h.text,h);});S.held=[];
    if(q.length){log('society','Gate','Gate internet is back. '+q.length+' saved '+(q.length===1?'entry':'entries')+' sent on. Nothing lost or repeated in this simulation.',{tone:'ok',metric:'caught up in '+(0.22*q.length+0.5).toFixed(1)+' s'});mark('synced');}
    else log('society','Gate','Gate internet is back. Nothing was waiting to be sent.',{tone:'ok'});});
  }
 },

function qr(code){
 var seed=parseInt(fnv(code),16),n=21,r='';
 function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
 for(var y=0;y<n;y++)for(var x=0;x<n;x++){
  var zone=(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8),on;
  if(zone){var fx=x<8?x:n-1-x,fy=y<8?y:n-1-y;on=fx<7&&fy<7&&(fx===0||fx===6||fy===0||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4));}
  else on=rnd()>0.5;
  if(on)r+='<rect x="'+x+'" y="'+y+'" width="1.02" height="1.02"/>';}
 return '<svg class="qr" viewBox="-2 -2 25 25" role="img" aria-label="Sample QR code for this pass"><rect x="-2" y="-2" width="25" height="25" fill="#fff"/><g fill="#14213D">'+r+'</g></svg>';
}

  (B.paid?'<div><span>Paid ('+B.how.join(', ')+')</span><span>'+rupee(B.paid)+'</span></div>':'')+(B.paid&&m.due>0?'<div><span>Still to pay</span><span>'+rupee(m.due)+'</span></div>':'')+'</div>';
  foot=(!B.discount&&!B.paid&&m.sub>0?'<button class="btn ghost" data-action="pos-discount">Give 10% discount</button>':'')+
   (m.due>0?'<button class="btn" data-action="pos-pay" data-arg="cash">Take cash</button><button class="btn" data-action="pos-pay" data-arg="card">Take card</button><button class="btn" data-action="pos-pay" data-arg="UPI">Take UPI</button>'
           :'<button class="btn" data-action="pos-close">Print and close bill</button>');
 }
 var over='';
 if(R.modal){var l=R.modal.kind==='void'?line(R.modal.line):null,isV=R.modal.kind==='void',list=isV?VOID_REASONS:DISC_REASONS,key=isV?'vreason':'dreason';
  over='<div class="over dim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Manager approval"><p><strong>'+(l?'Remove '+l.qty+'× '+l.name+' from the bill?':'Give a 10% discount on the dishes ordered so far?')+'</strong></p><p class="tiny">This needs a manager. The owner is told as soon as it is approved.</p>'+
   '<label class="field" for="f-vreason">Reason<select id="f-vreason" data-bind="'+key+'">'+list.map(function(x){return '<option'+sel(x,S.form[key])+'>'+x+'</option>';}).join('')+'</select></label>'+
   '<label class="field" for="f-pin">Manager PIN (2580 in this prototype)<input id="f-pin" data-bind="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" value="'+esc(S.form.pin)+'"></label>'+
   (R.modal.err?'<p class="err" role="alert">'+R.modal.err+'</p>':'')+
   '<div class="row"><button class="btn" data-action="pos-modal-ok">Approve with PIN</button><button class="btn ghost" data-action="pos-modal-cancel">Go back</button></div></div></div>';}
 return '<section class="actor"><h2>Billing screen</h2><p class="who">Cashier’s counter</p>'+device('tablet','Wi-Fi',b,foot,over)+'</section>';
}
function vKDS(){
 var cols=['Hot','Cold','Bar'].map(function(st){var ls=S.rst.lines.filter(function(l){return l.st===st&&!(l.closed&&l.status!=='new');});
  return '<div><h3>'+st+' station</h3>'+(ls.map(function(l){return '<div class="tkt '+(l.status==='new'?'':l.status)+'"><div class="meta"><span>Table '+l.table+'</span><span data-since="'+l.since+'"></span></div><b>'+l.qty+'× '+l.name+'</b>'+(l.status==='new'?'<button data-action="kds-ready" data-arg="'+l.id+'">Ready</button>':'<span>'+(l.status==='ready'?'Ready':'Cancelled')+'</span>')+'</div>';}).join('')||'<p class="tiny" style="color:#9BA7BE">Nothing to make.</p>')+'</div>';}).join('');
 return '<section class="actor"><h2>Kitchen screen</h2><p class="who">One column for each station</p><div class="dev tablet kds"><div class="cols">'+cols+'</div></div></section>';
}
function vOwner(){
 var R=S.rst,got=R.bill.paid;R.bills.forEach(function(b){got+=b.printed;});
 var vq=0,vsum=0;R.voids.forEach(function(v){vq+=v.qty;vsum+=v.amt;});
 var b='<div class="scr-h"><b>Spice Route</b><span class="tiny">Owner</span></div>'+
  '<h3 class="sub">Alerts</h3>'+R.alerts.slice(0,3).map(function(a){return '<div class="alert '+a.tone+'"><time>'+a.t+'</time>'+esc(a.text)+'</div>';}).join('')+(R.alerts.length>3?'<p class="tiny">'+(R.alerts.length-3)+' earlier alerts</p>':'')+
  '<h3 class="sub">Today so far</h3><div class="sum"><div><b>'+rupee(got)+'</b><span>collected, with GST</span></div><div><b>'+R.bills.length+'</b><span>bills closed</span></div><div><b>'+vq+(vsum?' ('+rupee(vsum)+')':'')+'</b><span>dishes cancelled</span></div><div><b>'+rupee(R.discClosed+billMath().disc)+'</b><span>discounts given</span></div><div><b>'+rupee(R.refunds)+'</b><span>refunds recorded</span></div><div><b>'+R.pinFails+'</b><span>wrong manager PIN tries</span></div></div>';
 return '<section class="actor"><h2>Owner’s phone</h2><p class="who">Kavita Menon, away from the restaurant</p>'+device('phone','5G',b,'','')+'</section>';
}
function vChain(){
 var R=S.rst,lab={ok:['ok','Matches'],changed:['stop','Changed after printing'],after:['warn','Needs re-checking']};
 return '<section class="register" aria-label="Bill chain"><div class="reg-h"><h2>Closed bills</h2><div class="row"><button class="btn ghost sm" data-action="chain-tamper">Change a past bill in the database</button><button class="btn sm" data-action="chain-check">Check the bills</button></div></div>'+
  '<p class="tiny" style="padding:0 14px 6px">Each bill carries a fingerprint built from its own contents and the bill before it, so a quiet change breaks the chain. The fingerprints here are simplified for the prototype.</p>'+
  '<div class="reg-scroll"><table class="tbl"><thead><tr><th>Bill</th><th>Check</th><th>Time</th><th>Total</th><th>Fingerprint</th></tr></thead><tbody>'+R.bills.map(function(b,i){var c=R.checked?lab[R.checked[i]]:null;
   return '<tr><td class="nw">'+b.no+'</td><td>'+(c?'<span class="chip '+c[0]+'">'+c[1]+'</span>':'<span class="tiny">Not checked yet</span>')+'</td><td>'+b.t+'</td><td>'+rupee(b.total)+'</td><td class="fp">'+b.hash+'</td></tr>';}).join('')+'</tbody></table></div></section>';
}
function vAudit(){
 var ev=S.events.slice().reverse(),r=S.auditOk;
 return '<section class="audit"><div class="audit-h"><div><h2>One log for both products</h2><p>The society and the restaurant write to one audit log, and each customer would see only its own rows. Every entry carries a fingerprint tied to the entry before it. In this prototype nothing can alter the log, so the check always passes; the working demo will let you change an entry and see it caught.</p></div>'+
  '<div class="row"><button class="btn" data-action="audit-verify">Check the log</button>'+(r?'<span class="chip '+(r.ok?'ok':'stop')+'" role="status">'+(r.ok?'All '+r.n+' entries linked and unchanged':'The log was altered')+'</span>':'')+'</div></div>'+
  '<div class="audit-scroll"><table class="tbl"><thead><tr><th>Time</th><th>Product</th><th>Who</th><th>What happened</th><th>Fingerprint</th></tr></thead><tbody>'+ev.map(function(e){
   return '<tr><td>'+e.t+'</td><td><span class="chip '+(e.domain==='society'?'info':'warn')+'">'+(e.domain==='society'?'Society':'Restaurant')+'</span></td><td>'+esc(e.actor)+'</td><td>'+esc(e.text)+'</td><td class="fp">'+e.hash+'</td></tr>';}).join('')+'</tbody></table></div></section>';
}

var app=document.getElementById('app'),live1=document.getElementById('live'),lastView='',prevFlags={},lastSay='';
var SCROLLERS='.body,.reg-scroll,.cols,.audit-scroll';
function render(){
 var a=document.activeElement,fid=a&&a.id,fkey=a&&a.dataset&&a.dataset.action?[a.dataset.action,a.dataset.arg||'']:null,pos=null,i;
 try{pos=a&&a.selectionStart;}catch(e){}
 var sc=[],els=app.querySelectorAll(SCROLLERS);for(i=0;i<els.length;i++)sc.push(els[i].scrollTop);
 var body;
 if(S.view==='society')body='<main><div class="stage soc">'+vResident()+vGuard()+vGate()+vDash()+'</div>'+vRegister()+'</main>';
 else if(S.view==='restaurant')body='<main><div class="stage rst">'+vCustomer()+vPOS()+vKDS()+vOwner()+'</div>'+vChain()+'</main>';
 else body='<main>'+vAudit()+'</main>';
 app.innerHTML=vBar()+vGuide()+body+'<p class="foot">Everything on this page runs in your browser. Names, flats, bills and speeds are made up, the QR code is a sample, nothing is digitally signed or sent to a server, and no message, call or payment is really made.</p>';
 if(lastView===S.view){els=app.querySelectorAll(SCROLLERS);if(els.length===sc.length)for(i=0;i<els.length;i++)els[i].scrollTop=sc[i];}
 lastView=S.view;
 var flags={call:ringing()?ringing().id:'',sosc:S.res.sosConfirm?1:'',cert:S.res.cert?1:'',alarm:(sosOpen()&&!S.sos.ack)?1:'',modal:S.rst.modal?S.rst.modal.kind:''};
 var want={call:'[data-action="call-1"]',sosc:'[data-action="res-sos-cancel"]',cert:'[data-action="res-cert-close"]',alarm:'[data-action="guard-sos-ack"]',modal:'#f-pin'},n=null,k;
 for(k in flags)if(flags[k]&&flags[k]!==prevFlags[k])n=app.querySelector(want[k])||n;
 prevFlags=flags;
 if(!n){if(fid)n=document.getElementById(fid);
  else if(fkey){var c=app.querySelectorAll('[data-action="'+fkey[0]+'"]');for(i=0;i<c.length;i++)if((c[i].dataset.arg||'')===fkey[1]){n=c[i];break;}}}
 if(n&&!n.disabled){n.focus({preventScroll:true});if(pos!=null&&n.id===fid&&n.setSelectionRange){try{n.setSelectionRange(pos,pos);}catch(e){}}}
 if(S.hint){try{var h=app.querySelectorAll(S.hint.sel);for(i=0;i<h.length;i++)h[i].classList.add('hint');if(h[0]&&h[0].scrollIntoView)h[0].scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}}
 var say=(S.online?'':'Gate internet is off. ')+(S.gate.open?'Gate open. ':'Gate closed. ')+(flags.call?'Incoming call on the resident’s phone. ':'')+(flags.alarm?'SOS alarm on the guard’s tablet. ':'');
 if(say!==lastSay&&live1){live1.textContent=say;lastSay=say;}
 live();
}
function live(){
 var c=clock(),now=Date.now(),i,els=app.querySelectorAll('[data-clock]');
 for(i=0;i<els.length;i++)els[i].textContent=els[i].dataset.clock==='long'?c:c.slice(0,5);
 els=app.querySelectorAll('[data-deadline]');
 for(i=0;i<els.length;i++)els[i].textContent=Math.max(0,Math.ceil((+els[i].dataset.deadline-now)/1000));
 els=app.querySelectorAll('[data-since]');
 for(i=0;i<els.length;i++){var s=Math.floor((now-(+els[i].dataset.since))/1000);els[i].textContent=Math.floor(s/60)+':'+pad(s%60);}
}
function tick(){
 var now=Date.now(),dirty=false;
 if(S.gate.open&&now>S.gate.closeAt){closeGate();if(S.gate.plateOk)S.gate.plate='';dirty=true;}
 S.reqs.forEach(function(r){
  if(r.status!=='pending')return;
  if(r.autoAt){if(now>r.autoAt){finishReq(r,true,'Resident allowed it in the app (simulated)');dirty=true;}}
  else if(now>r.deadline){r.status='calling';
   log('society','Platform','Nobody in flat '+r.flat+' answered in the app for '+r.who+'. A phone call was placed to the flat.',{tone:'warn',metric:'call out in '+speed(1.5,2.5)+' s'});mark('call_placed');dirty=true;}
 });
 var rg=ringing();
 if(rg){if(!rg.callEnd){rg.callEnd=now+CALL_WAIT;dirty=true;}
  else if(now>rg.callEnd){rg.status='noanswer';
   log('society','Platform','The flat did not pick up the phone call about '+rg.who+' either (12 s here, 45 s in the real product). The guard’s tablet now offers the next step.',{tone:'warn'});mark('call_resolved');dirty=true;}}
 if(sosOpen()&&!S.sos.ack&&!S.sos.escalated&&now>S.sos.escalateAt){S.sos.escalated=true;S.sos.steps.push(clock().slice(0,5)+' No guard accepted, supervisor phoned');
  log('society','Platform','No guard accepted the SOS in time (15 s here, 60 s in the real product). The supervisor is being phoned.',{tone:'stop'});dirty=true;}
 if(S.hint&&now>S.hint.until){S.hint=null;dirty=true;}
 if(dirty)render();else live();
}
function boot(){EPOCH++;T0=Date.now();S=fresh();seed();}

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-action]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;
 var fn=A[el.dataset.action];if(fn){fn(el.dataset.arg);render();}
});
document.addEventListener('input',function(e){var k=e.target.dataset&&e.target.dataset.bind;if(k)S.form[k]=e.target.value;});
document.addEventListener('change',function(e){
 var t=e.target;if(t.dataset&&t.dataset.bind)S.form[t.dataset.bind]=t.value;
 if(t.tagName==='SELECT'&&t.dataset.action&&A[t.dataset.action]){A[t.dataset.action](t.value);render();}
});
document.addEventListener('keydown',function(e){
 var id=e.target.id;
 if(e.key==='Escape'){
  if(S.rst.modal&&S.view==='restaurant'){A['pos-modal-cancel']();render();}
  else if(S.res.sosConfirm){S.res.sosConfirm=false;render();}
  else if(S.res.cert){S.res.cert=null;render();}
  return;}
 if(e.key!=='Enter')return;
 if(id==='f-pin'){e.preventDefault();A['pos-modal-ok']();render();}
 else if(id==='f-guest'&&!ringing()){A['res-create-pass']();render();}
 else if(id==='f-visitor'){A['guard-ask']();render();}
});
boot();render();setInterval(tick,250);
})();
</script>
</body>
</html>
